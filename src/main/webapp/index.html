<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index Page</title>
</head>
<body>
<form method="POST" action="/demo4/Controller">
    <table>
        <tr>
            <td>First Name :</td>
            <td><input type="text" name="firstName" /></td>
        </tr>
        <tr>
            <td>Last Name :</td>
            <td><input type="text" name="lastName" /></td>
        </tr>
        <tr>
            <td>Date Of Birth :</td>
            <td><input type="date" name="birthday" /></td>
        </tr>
        <tr>
            <td>Sexe :</td>
            <td><input type="radio" name="sexe" value="male" />Male</td>
            <td><input type="radio" name="sexe" value="female" />Male</td>
        </tr>
    </table>
    <button type="submit">Send</button>
</form>
</body>
</html>
